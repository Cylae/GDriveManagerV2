name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q gdsm tests main.py
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy gdsm
      - run: python -m coverage run -m unittest discover -s tests -v
      - run: python -m coverage report
      - name: Tkinter smoke tests
        if: runner.os == 'Linux' && matrix.python == '3.12'
        env:
          GDSM_GUI_TESTS: '1'
        run: xvfb-run -a python -m unittest discover -s tests/integration -v
