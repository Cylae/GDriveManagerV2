[project]
name = "gdrive-space-manager"
version = "0.4.0"
description = "A desktop Google Drive manager with verified downloads and guarded trash operations"
requires-python = ">=3.11"
dependencies = ["keyring>=25.7,<26"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "TRY004", "BLE"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true

[tool.coverage.run]
source = ["gdsm"]

[tool.coverage.report]
show_missing = true
